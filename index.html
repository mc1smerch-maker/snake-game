<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Retro Snake 2000</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #222;
            color: #000;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        /* Стилизация под экран старой Нокии */
        #phone-screen {
            background-color: #8b956d; /* Тот самый зелено-серый цвет */
            border: 10px solid #444;
            border-radius: 5px;
            padding: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        canvas {
            background-color: #8b956d;
            border: 2px solid #000;
        }
        #score {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
            text-align: right;
        }
        /* Кнопки управления на экране */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            background-color: #444;
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }
        .btn:active { background-color: #666; }
        .empty { visibility: hidden; }
    </style>
</head>
<body>

    <div id="phone-screen">
        <div id="score">Score: 0</div>
        <canvas id="gameCanvas" width="300" height="300"></canvas>
    </div>

    <!-- Пульт управления для сенсорных экранов телефонов -->
    <div class="controls">
        <div class="btn empty"></div>
        <div class="btn" onclick="changeDirection('UP')">▲</div>
        <div class="btn empty"></div>
        <div class="btn" onclick="changeDirection('LEFT')">◀</div>
        <div class="btn empty"></div>
        <div class="btn" onclick="changeDirection('RIGHT')">▶</div>
        <div class="btn empty"></div>
        <div class="btn" onclick="changeDirection('DOWN')">▼</div>
        <div class="btn empty"></div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const grid = 15;
        let score = 0;

        let snake = [{x: 150, y: 150}, {x: 135, y: 150}, {x: 120, y: 150}];
        let dx = grid;
        let dy = 0;

        let food = {x: 0, y: 0};
        generateFood();

        function main() {
            if (hasGameEnded()) {
                alert("Игра окончена! Ваши очки: " + score);
                resetGame();
            }
            setTimeout(function onTick() {
                clearCanvas();
                drawFood();
                moveSnake();
                drawSnake();
                main();
            }, 120); // Скорость игры (меньше число = быстрее)
        }

        function clearCanvas() {
            ctx.fillStyle = "#8b956d";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach(part => {
                ctx.fillStyle = '#000';
                ctx.fillRect(part.x, part.y, grid - 2, grid - 2);
            });
        }

        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
            if (hasEatenFood) {
                score += 10;
                document.getElementById('score').innerText = "Score: " + score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * (canvas.width / grid)) * grid;
            food.y = Math.floor(Math.random() * (canvas.height / grid)) * grid;
        }

        function drawFood() {
            ctx.fillStyle = '#000';
            ctx.fillRect(food.x, food.y, grid - 2, grid - 2);
        }

        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= canvas.width;
            const hitToptWall = snake[0].x < 0;
            const hitTopWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= canvas.height;
            return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
        }

        function changeDirection(dir) {
            const goingUp = dy === -grid;
            const goingDown = dy === grid;
            const goingRight = dx === grid;
            const goingLeft = dx === -grid;

            if (dir === 'LEFT' && !goingRight) { dx = -grid; dy = 0; }
            if (dir === 'UP' && !goingDown) { dx = 0; dy = -grid; }
            if (dir === 'RIGHT' && !goingLeft) { dx = grid; dy = 0; }
            if (dir === 'DOWN' && !goingUp) { dx = 0; dy = grid; }
        }

        // Управление с клавиатуры ПК
        document.addEventListener("keydown", event => {
            if (event.keyCode === 37) changeDirection('LEFT');
            if (event.keyCode === 38) changeDirection('UP');
            if (event.keyCode === 39) changeDirection('RIGHT');
            if (event.keyCode === 40) changeDirection('DOWN');
        });

        function resetGame() {
            snake = [{x: 150, y: 150}, {x: 135, y: 150}, {x: 120, y: 150}];
            dx = grid; dy = 0; score = 0;
            document.getElementById('score').innerText = "Score: " + score;
            generateFood();
        }

        main();
    </script>
</body>
</html>
