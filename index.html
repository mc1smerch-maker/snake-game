<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SNAKE VI</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0314;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-container {
            background-color: #140727;
            border: 3px solid #00f0ff;
            border-radius: 20px;
            padding: 15px;
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        #logo {
            font-size: 24px;
            font-weight: bold;
            color: #00f0ff;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #logo span {
            color: #ff007f;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            background-color: #000;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            border-left: 4px solid #ff007f;
            font-family: monospace;
            font-size: 16px;
        }
        #cash {
            color: #2ecc71;
            font-weight: bold;
        }
        #canvas-holder {
            border: 2px solid #ff007f;
            background-color: #05010a;
            line-height: 0;
        }
        canvas {
            display: block;
        }
        /* Кнопки управления без лишней анимации */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 65px);
            grid-template-rows: repeat(3, 55px);
            gap: 10px;
            margin-top: 15px;
        }
        .btn {
            background-color: #220b3d;
            border: 2px solid #00f0ff;
            border-radius: 12px;
            color: #00f0ff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .btn:active {
            background-color: #ff007f;
            border-color: #ff007f;
            color: #fff;
        }
        .btn.action {
            border-color: #ff007f;
            color: #ff007f;
            font-size: 12px;
            font-weight: bold;
        }
        .empty { visibility: hidden; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="logo">SNAKE <span>VI</span></div>
        
        <div id="hud">
            <span>VICE CITY</span>
            <span id="cash">$0</span>
        </div>

        <div id="canvas-holder">
            <canvas id="gameCanvas" width="260" height="260"></canvas>
        </div>

        <div class="controls">
            <div class="btn empty"></div>
            <div class="btn" onclick="press('UP')">▲</div>
            <div class="btn empty"></div>
            <div class="btn" onclick="press('LEFT')">◀</div>
            <div class="btn action" onclick="resetGame()">START</div>
            <div class="btn" onclick="press('RIGHT')">▶</div>
            <div class="btn empty"></div>
            <div class="btn" onclick="press('DOWN')">▼</div>
            <div class="btn empty"></div>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        if (tg) tg.expand();

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const cashDisplay = document.getElementById("cash");
        
        const grid = 13; // Размер клетки (260 / 13 = 20 клеток по горизонтали и вертикали)
        let score = 0;
        let gameInterval = null;

        let snake = [];
        let dx = grid;
        let dy = 0;
        let food = {x: 0, y: 0};
        let nextDir = 'RIGHT';

        function initGame() {
            // Начальные три блока змейки по центру поля
            snake = [
                {x: grid * 7, y: grid * 10},
                {x: grid * 6, y: grid * 10},
                {x: grid * 5, y: grid * 10}
            ];
            dx = grid;
            dy = 0;
            nextDir = 'RIGHT';
            score = 0;
            updateHUD();
            spawnFood();
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 140); // Стабильная скорость без просадок
        }

        function gameLoop() {
            // Применяем направление движения
            if (nextDir === 'LEFT' && dx === 0) { dx = -grid; dy = 0; }
            if (nextDir === 'UP' && dy === 0) { dx = 0; dy = -grid; }
            if (nextDir === 'RIGHT' && dx === 0) { dx = grid; dy = 0; }
            if (nextDir === 'DOWN' && dy === 0) { dx = 0; dy = grid; }

            // Расчет позиции новой головы
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Проверка столкновения со стенами или хвостом
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height || hitSelf(head)) {
                clearInterval(gameInterval);
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                alert("WASTED! Вы заработали: $" + score * 100);
                initGame();
                return;
            }

            // Добавляем голову в начало массива
            snake.unshift(head);

            // Проверка: съели ли еду (деньги)
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateHUD();
                if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                spawnFood();
            } else {
                // Если еду не съели, удаляем хвост, создавая эффект движения
                snake.pop();
            }

            draw();
        }

        function draw() {
            // Очистка поля — сплошной темный цвет
            ctx.fillStyle = "#05010a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Рисуем Еду — яркий зеленый квадрат (деньги)
            ctx.fillStyle = "#2ecc71";
            ctx.fillRect(food.x + 1, food.y + 1, grid - 2, grid - 2);

            // Рисуем Змейку — сплошные блоки без размытия
            snake.forEach((part, index) => {
                if (index === 0) {
                    ctx.fillStyle = "#00f0ff"; // Голова — неоновый голубой
                } else {
                    ctx.fillStyle = "#ff007f"; // Тело — неоновый розовый
                }
                ctx.fillRect(part.x + 1, part.y + 1, grid - 2, grid - 2);
            });
        }

        function spawnFood() {
            const cols = canvas.width / grid;
            const rows = canvas.height / grid;
            
            while (true) {
                let fx = Math.floor(Math.random() * cols) * grid;
                let fy = Math.floor(Math.random() * rows) * grid;
                
                // Проверяем, чтобы еда не появилась на теле змейки
                let onSnake = snake.some(p => p.x === fx && p.y === fy);
                if (!onSnake) {
                    food.x = fx;
                    food.y = fy;
                    break;
                }
            }
        }

        function hitSelf(head) {
            return snake.some((p, i) => i !== 0 && p.x === head.x && p.y === head.y);
        }

        function press(dir) {
            if (dir === 'LEFT' && dx === 0) nextDir = 'LEFT';
            if (dir === 'UP' && dy === 0) nextDir = 'UP';
            if (dir === 'RIGHT' && dx === 0) nextDir = 'RIGHT';
            if (dir === 'DOWN' && dy === 0) nextDir = 'DOWN';
        }

        function updateHUD() {
            cashDisplay.innerText = "$" + (score * 100);
        }

        function resetGame() {
            initGame();
        }

        // Кнопки клавиатуры ПК для тестов
        document.addEventListener("keydown", e => {
            if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") press('LEFT');
            if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") press('UP');
            if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") press('RIGHT');
            if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") press('DOWN');
        });

        // Запуск первой игры при открытии приложения
        initGame();
    </script>
</body>
</html>
