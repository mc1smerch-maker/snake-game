<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nokia 3310 Snake</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Корпус ретро-телефона */
        #nokia-body {
            background: linear-gradient(135s, #3a4454, #2b323f);
            border: 4px solid #1c2029;
            border-radius: 35px;
            padding: 25px 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 320px;
        }
        /* Монохромный экран */
        #screen-border {
            background-color: #cddb9b;
            border: 8px solid #222;
            border-radius: 10px;
            padding: 10px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            width: 260px;
            box-sizing: border-box;
        }
        #score-board {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 2px solid #000;
            padding-bottom: 4px;
            margin-bottom: 6px;
        }
        canvas {
            display: block;
            background-color: #cddb9b;
        }
        /* Кнопочная панель */
        .keyboard {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(3, 55px);
            gap: 12px;
            margin-top: 25px;
        }
        .key {
            background: linear-gradient(180deg, #e0e0e0, #b5b5b5);
            color: #222;
            border: 2px solid #666;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 0 #777;
            active-transform: translateY(4px);
        }
        .key:active {
            box-shadow: 0 0px 0 #777;
            transform: translateY(4px);
            background: #999;
        }
        .key span {
            font-size: 10px;
            color: #555;
            font-weight: normal;
        }
        .empty { visibility: hidden; }
    </style>
</head>
<body>

    <div id="nokia-body">
        <div id="screen-border">
            <div id="score-board">
                <span>🐍 SNAKE</span>
                <span id="scoreText">0000</span>
            </div>
            <canvas id="gameCanvas" width="240" height="240"></canvas>
        </div>

        <!-- Клавиатура Nokia -->
        <div class="keyboard">
            <div class="key empty"></div>
            <div class="key" onclick="pressKey('UP')">2<span>▲</span></div>
            <div class="key empty"></div>
            <div class="key" onclick="pressKey('LEFT')">4<span>◀</span></div>
            <div class="key" onclick="resetGame()">5<span>RESET</span></div>
            <div class="key" onclick="pressKey('RIGHT')">6<span>▶</span></div>
            <div class="key empty"></div>
            <div class="key" onclick="pressKey('DOWN')">8<span>▼</span></div>
            <div class="key empty"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreText = document.getElementById("scoreText");
        
        const grid = 12; // Размер ячейки шкалы
        let score = 0;
        let gameInterval = null;

        let snake = [];
        let dx = grid;
        let dy = 0;
        let food = {x: 0, y: 0};
        let nextDirection = 'RIGHT';

        function initGame() {
            snake = [
                {x: grid * 5, y: grid * 10},
                {x: grid * 4, y: grid * 10},
                {x: grid * 3, y: grid * 10}
            ];
            dx = grid;
            dy = 0;
            nextDirection = 'RIGHT';
            score = 0;
            updateScoreDisplay();
            spawnFood();
            
            if(gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 130); // Скорость змейки
        }

        function gameLoop() {
            applyDirection();
            
            if (checkGameOver()) {
                clearInterval(gameInterval);
                alert("GAME OVER! Очки: " + score);
                initGame();
                return;
            }

            // Логика движения головы
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            // Проверка съедения еды
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateScoreDisplay();
                spawnFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            // Очистка экрана под ретро-цвет
            ctx.fillStyle = "#cddb9b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Рисуем рамку игрового поля внутри экрана
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);

            // Рисуем еду (квадратик с пикселем внутри)
            ctx.fillStyle = "#000";
            ctx.fillRect(food.x + 1, food.y + 1, grid - 2, grid - 2);

            // Рисуем змейку пиксельными блоками
            snake.forEach((part, index) => {
                ctx.fillStyle = "#000";
                ctx.fillRect(part.x + 1, part.y + 1, grid - 2, grid - 2);
                // Для реалистичности ретро-экранов делаем небольшие зазоры
                if(index === 0) {
                    ctx.fillStyle = "#cddb9b";
                    ctx.fillRect(part.x + 4, part.y + 4, grid - 8, grid - 8);
                }
            });
        }

        function spawnFood() {
            const cols = canvas.width / grid;
            const rows = canvas.height / grid;
            
            // Генерируем случайную позицию, не пересекающуюся со змейкой
            while (true) {
                let currentFoodX = Math.floor(Math.random() * (cols - 2) + 1) * grid;
                let currentFoodY = Math.floor(Math.random() * (rows - 2) + 1) * grid;
                
                let onSnake = snake.some(part => part.x === currentFoodX && part.y === currentFoodY);
                if (!onSnake) {
                    food.x = currentFoodX;
                    food.y = currentFoodY;
                    break;
                }
            }
        }

        function applyDirection() {
            if (nextDirection === 'LEFT' && dx === 0) { dx = -grid; dy = 0; }
            if (nextDirection === 'UP' && dy === 0) { dx = 0; dy = -grid; }
            if (nextDirection === 'RIGHT' && dx === 0) { dx = grid; dy = 0; }
            if (nextDirection === 'DOWN' && dy === 0) { dx = 0; dy = grid; }
        }

        function pressKey(dir) {
            const goingUp = dy === -grid;
            const goingDown = dy === grid;
            const goingRight = dx === grid;
            const goingLeft = dx === -grid;

            if (dir === 'LEFT' && !goingRight) nextDirection = 'LEFT';
            if (dir === 'UP' && !goingDown) nextDirection = 'UP';
            if (dir === 'RIGHT' && !goingLeft) nextDirection = 'RIGHT';
            if (dir === 'DOWN' && !goingUp) nextDirection = 'DOWN';
        }

        function checkGameOver() {
            const head = snake[0];
            // Столкновение со стенами
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return true;
            }
            // Столкновение с собственным хвостом
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) return true;
            }
            return false;
        }

        function updateScoreDisplay() {
            scoreText.innerText = String(score).padStart(4, '0');
        }

        function resetGame() {
            initGame();
        }

        // Управление с клавиатуры компьютера
        document.addEventListener("keydown", event => {
            if (event.key === "ArrowLeft" || event.key === "4") pressKey('LEFT');
            if (event.key === "ArrowUp" || event.key === "2") pressKey('UP');
            if (event.key === "ArrowRight" || event.key === "6") pressKey('RIGHT');
            if (event.key === "ArrowDown" || event.key === "8") pressKey('DOWN');
            if (event.key === "5") resetGame();
        });

        // Первый запуск при загрузке страницы
        initGame();
    </script>
</body>
</html>
